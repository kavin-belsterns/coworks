# Action versions: per page at fetch time 2026-10-31 (https://playwright.dev/docs/ci-intro).
# Check for newer majors before use.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:unit
      - name: Integration tests
        run: npx prisma migrate deploy && npm run test:integration
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/app_test
          AUTH_SECRET: ci-placeholder
          BASE_URL: http://localhost:3000
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/app_dev
          AUTH_SECRET: ci-build-placeholder
          BASE_URL: http://localhost:3000
